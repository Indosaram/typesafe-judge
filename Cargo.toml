[package]
name = "typesafe-judge"
version = "0.1.0"
edition = "2021"
authors = ["Indo Yoon <freedomzero91@gmail.com>"]
description = "Fast CLI decision engine powered by TypeSafe System One (Jev) for coding tasks, verification gates, and agent workflows."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Indosaram/typesafe-judge"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
